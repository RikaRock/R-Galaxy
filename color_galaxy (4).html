var state='title',selI=0,ovSel=0;
var HEROS=[{name:'РИКА',hp:3,rate:0.16,dmg:1,mul:1.25,bonus:1,twin:false,col:'#ff5a3c',desc:'Магма-пушка · очки x1.25'},
{name:'КИССИ',hp:3,rate:0.2,dmg:1,mul:1,bonus:1.8,twin:true,col:'#ff4fa0',desc:'Двойной выстрел · бонусы x1.8'},
{name:'ВИТ',hp:5,rate:0.26,dmg:2,mul:1,bonus:1,twin:false,col:'#3cc4ff',desc:'Танк: 5 сердец · урон x2'}];
var P={x:W/2,y:H-90,hp:3,maxhp:3,r:16,cool:0,shield:0,dbl:0,inv:0};

function startGame(){var hs=HEROS[selI];P={x:W/2,y:H-90,hp:hs.hp,maxhp:hs.hp,r:16,cool:0,shield:0,dbl:0,inv:0};enemies=[];ebul=[];pbul=[];bonuses=[];parts=[];boss=null;level=0;score=0;queue=[];buildQueue(0);spawnT=0.6;watchT=0;banner='УРОВЕНЬ 1';bannerT=2;state='play';}
function buildQueue(li){var L=LVL[li];queue=[];for(var i=0;i<L.n;i++){queue.push(L.en[i%L.en.length]);}}
function spawnE(){if(!queue.length)return;var ty=queue.shift();
 var hp={sekach:3,puh:2,zolt:4,korn:5}[ty];var vy={sekach:64,puh:38,zolt:46,korn:26}[ty];
 enemies.push({type:ty,x:rnd(70,W-70),y:-40,r:ty==='korn'?22:(ty==='puh'?15:17),hp:hp,t:rnd(0,6),ph:rnd(0,6.3),vy:vy,cool:rnd(1.2,2.6)});}
function spawnBoss(){if(boss)return;var i=LVL[level].boss;
 boss={type:i,x:W/2,y:120,r:44,hp:[60,85,110][i],maxhp:[60,85,110][i],t:0,cool:2,mt:0,aimx:W/2,heat:0,warned:false,fired:false,firing:false};
 banner=['СЕКАЧ-МАСТЕР!','ЖЁЛТЫЙ КОРОЛЬ!','УТЮЖОК-9000!'][i];bannerT=2;}
function saveRec(){if(score>rec){rec=score;try{localStorage.setItem('cg_rec',String(rec));}catch(e){}}}
function hurt(){if(P.inv>0)return;
 if(P.shield>0){P.shield=0;sfx.hit();boom(P.x,P.y,'#3cc4ff',10);P.inv=0.8;return;}
 P.hp--;P.inv=1.1;sfx.hurt();shake=0.5;boom(P.x,P.y,'#ff4f6a',12);
 if(P.hp<=0){state='over';sfx.lose();saveRec();ovSel=0;}}
function fire(){var hs=HEROS[selI];P.cool=hs.rate;
 if(hs.twin){pbul.push({x:P.x-8,y:P.y-14,r:4,dmg:hs.dmg});pbul.push({x:P.x+8,y:P.y-14,r:4,dmg:hs.dmg});}
 else{pbul.push({x:P.x,y:P.y-18,r:5,dmg:hs.dmg});}
 sfx.shot();}
function addScore(v){score+=Math.round(v*HEROS[selI].mul);}
function boom(x,y,c,n){for(var i=0;i<(n||14);i++){parts.push({x:x,y:y,vx:rnd(-120,120),vy:rnd(-120,120),l:rnd(0.3,0.7),c:c});}}
function bossAI(b,dt){var i=b.type;
 if(i===0){b.x=W/2+Math.sin(b.t*0.7)*270;b.y=120+Math.sin(b.t*1.5)*22;b.cool-=dt;
  if(b.cool<=0){b.cool=1.7;for(var k=-1;k<=1;k++){ebul.push({x:b.x,y:b.y+30,vx:k*90,vy:170,r:7});}if(Math.random()<0.4){ebul.push({x:b.x,y:b.y+30,vx:0,vy:230,r:7});}}}
 else if(i===1){b.x=W/2+Math.sin(b.t*0.5)*250;b.y=110+Math.abs(Math.sin(b.t*1.1))*70;b.cool-=dt;
  if(b.cool<=0){b.cool=2.1;var dx=P.x-b.x;for(var k2=0;k2<3;k2++){ebul.push({x:b.x,y:b.y+24,vx:dx*0.12*(k2-1)+rnd(-30,30),vy:120+k2*40,r:7,type:'arc'});}}}
 else{b.heat=clamp(b.heat-0.2*dt,0,1);
  if(b.mt<1.2){b.aimx=P.x;if(!b.warned&&b.mt>0.7){b.warned=true;sfx.laserA();}}
  else if(b.mt<1.75){b.firing=true;if(!b.fired){b.fired=true;b.heat=1;sfx.laserF();}if(P.inv<=0&&Math.abs(P.x-b.aimx)<36)hurt();}
  else if(b.mt>3.2){b.mt=0;b.warned=false;b.fired=false;b.firing=false;}
  b.x=clamp(b.x+Math.sin(b.t*0.4)*70*dt,90,W-90);
  if(b.heat<0.4){b.cool-=dt;if(b.cool<=0){b.cool=1.8;ebul.push({x:b.x,y:b.y+20,vx:rnd(-60,60),vy:190,r:6});}}}
}
function upd(dt){var hs=HEROS[selI];
 var sp=270;if(keys['ArrowLeft']||keys['KeyA'])P.x-=sp*dt;if(keys['ArrowRight']||keys['KeyD'])P.x+=sp*dt;
 if(keys['ArrowUp']||keys['KeyW'])P.y-=sp*dt;if(keys['ArrowDown']||keys['KeyS'])P.y+=sp*dt;
 P.x=clamp(P.x,24,W-24);P.y=clamp(P.y,H*0.42,H-40);
 if(P.inv>0)P.inv-=dt;if(P.shield>0)P.shield-=dt;if(P.dbl>0)P.dbl-=dt;
 P.cool-=dt;if(keys['Space']&&P.cool<=0){fire();if(P.dbl>0){pbul.push({x:P.x-14,y:P.y-8,r:3.5,dmg:1});pbul.push({x:P.x+14,y:P.y-8,r:3.5,dmg:1});}}
 if(queue.length){spawnT-=dt;if(spawnT<=0){spawnE();spawnT=LVL[level].gap;}}
 if(!boss&&queue.length===0&&enemies.length===0){spawnBoss();}
 if(!boss){if(enemies.length===0){watchT+=dt;if(watchT>1.6){if(queue.length){spawnE();spawnE();watchT=0;}else{spawnBoss();watchT=0;}}}else{watchT=0;}}
 for(var i=enemies.length-1;i>=0;i--){var e=enemies[i];e.t+=dt;
  if(e.type==='sekach'){e.x+=Math.sin(e.t*2.2+e.ph)*70*dt;e.y+=e.vy*dt;if(e.t>6)e.y+=60*dt;}
  else if(e.type==='puh'){e.x+=Math.sin(e.t*1.4+e.ph)*50*dt;e.y+=e.vy*dt;}
  else if(e.type==='zolt'){e.x+=Math.cos(e.t*1.1+e.ph)*40*dt;e.y+=e.vy*dt*(e.y<H*0.35?1:0.35);e.cool-=dt;if(e.cool<=0){e.cool=rnd(1.6,2.6);ebul.push({x:e.x,y:e.y+10,vx:0,vy:150,r:6});}}
  else{e.y+=e.vy*dt;if(e.y>H*0.3)e.vy=0;e.x+=Math.sin(e.t*0.9+e.ph)*24*dt;e.cool-=dt;if(e.cool<=0&&e.y>0){e.cool=rnd(2,3.2);var dx=P.x-e.x,dy=P.y-e.y,dd=Math.sqrt(dx*dx+dy*dy)||1;ebul.push({x:e.x,y:e.y,vx:dx/dd*160,vy:dy/dd*160,r:6});}}
  if(e.y>H+50||e.x<-60||e.x>W+60){enemies.splice(i,1);continue;}
  if(e.hp<=0){addScore({sekach:50,puh:40,zolt:70,korn:80}[e.type]);boom(e.x,e.y,'#ffb03c',16);sfx.boom();
   if(e.type==='puh'){for(var s2=0;s2<2;s2++){enemies.push({type:'puh',x:e.x+rnd(-14,14),y:e.y,r:9,hp:1,t:0,ph:rnd(0,6),vy:60,cool:99});}}
   if(Math.random()<0.16*hs.bonus){var ch2=Math.random();var bt=ch2<0.34?'heart':(ch2<0.67?'shield':'dbl');bonuses.push({x:e.x,y:e.y,type:bt,vy:70,t:0});}
   enemies.splice(i,1);continue;}
  if(d2(e.x,e.y,P.x,P.y)<(e.r+P.r)*(e.r+P.r)){hurt();e.hp-=3;}}
 if(boss){boss.t+=dt;bossAI(boss,dt);
  if(d2(boss.x,boss.y,P.x,P.y)<(boss.r+P.r)*(boss.r+P.r))hurt();
  if(boss.hp<=0){addScore(500+level*250);boom(boss.x,boss.y,'#ffd23e',40);sfx.boom();boss=null;
   if(level>=2){state='win';sfx.win();saveRec();ovSel=0;}
   else{level++;buildQueue(level);banner='УРОВЕНЬ '+(level+1);bannerT=2;}}}
 for(var i6=pbul.length-1;i6>=0;i6--){var b3=pbul[i6];b3.y-=560*dt;if(b3.y<-20){pbul.splice(i6,1);continue;}
  var hit=false;
  for(var j=enemies.length-1;j>=0;j--){var e2=enemies[j];if(d2(b3.x,b3.y,e2.x,e2.y)<(e2.r+b3.r)*(e2.r+b3.r)){e2.hp-=b3.dmg;sfx.hit();boom(b3.x,b3.y,'#ffd23e',4);hit=true;break;}}
  if(!hit&&boss&&d2(b3.x,b3.y,boss.x,boss.y)<(boss.r+b3.r)*(boss.r+b3.r)){boss.hp-=b3.dmg;sfx.hit();boom(b3.x,b3.y,'#ffd23e',4);hit=true;}
  if(hit)pbul.splice(i6,1);}
 for(var i7=ebul.length-1;i7>=0;i7--){var b4=ebul[i7];b4.x+=(b4.vx||0)*dt;b4.y+=(b4.vy||0)*dt;if(b4.type==='arc')b4.vy+=260*dt;
  if(b4.y>H+20||b4.y<-30||b4.x<-30||b4.x>W+30){ebul.splice(i7,1);continue;}
  if(P.inv<=0&&d2(b4.x,b4.y,P.x,P.y)<(b4.r+P.r)*(b4.r+P.r)){hurt();ebul.splice(i7,1);}}
 for(var i8=bonuses.length-1;i8>=0;i8--){var bn=bonuses[i8];bn.t+=dt;bn.y+=bn.vy*dt;
  if(bn.y>H+20){bonuses.splice(i8,1);continue;}
  if(d2(bn.x,bn.y,P.x,P.y)<(14+P.r)*(14+P.r)){sfx.bonus();
   if(bn.type==='shield')P.shield=8;else if(bn.type==='dbl')P.dbl=8;else P.hp=Math.min(P.maxhp,P.hp+1);
   bonuses.splice(i8,1);}}
 for(var i9=parts.length-1;i9>=0;i9--){var p2=parts[i9];p2.l-=dt;p2.x+=p2.vx*dt;p2.y+=p2.vy*dt;if(p2.l<=0)parts.splice(i9,1);}
 if(bannerT>0)bannerT-=dt;if(shake>0)shake-=dt;}
function cardRect(i){var cxs=[200,480,760];return {x:cxs[i]-100,y:180,w:200,h:270};}
function cardHit(x,y){for(var i=0;i<3;i++){var r=cardRect(i);if(x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h)return i;}return -1;}
function drawSelect(){glowTxt('ВЫБЕРИ МАСТЕРА',W/2,110,40,'#ffd23e');
 for(var i=0;i<3;i++){var r=cardRect(i);cx.save();
  if(i===selI){cx.shadowColor=HEROS[i].col;cx.shadowBlur=24;cx.strokeStyle=HEROS[i].col;cx.lineWidth=3;}else{cx.strokeStyle='rgba(255,255,255,0.25)';cx.lineWidth=2;}
  cx.fillStyle='rgba(20,14,44,0.85)';cx.fillRect(r.x,r.y,r.w,r.h);cx.strokeRect(r.x,r.y,r.w,r.h);cx.restore();
  drawHero(r.x+r.w/2,r.y+130,i,tGlob);
  cx.fillStyle='#fff';cx.font='bold 20px Arial';cx.textAlign='center';cx.fillText(HEROS[i].name,r.x+r.w/2,r.y+196);
  cx.font='12px Arial';cx.fillStyle='rgba(255,255,255,0.75)';cx.fillText(HEROS[i].desc,r.x+r.w/2,r.y+222);}
 glowTxt('СТРЕЛКИ ВЛЕВО-ВПРАВО - ВЫБОР',W/2,540,20,'#9ad0ff');
 glowTxt('ENTER ИЛИ ПРОБЕЛ - В БОЙ',W/2,574,20,'#ffd23e');}
function drawTitle(){glowTxt('COLOR GALAXY',W/2,H*0.42,64,'#ff4fa0');glowTxt('Неоновая аркада Рики',W/2,H*0.42+44,22,'#9ad0ff');
 if(Math.sin(tGlob*3)>-0.3)glowTxt('ПРОБЕЛ - СТАРТ',W/2,H*0.72,28,'#ffd23e');
 glowTxt('РЕКОРД: '+rec,W/2,H*0.72+40,18,'#8fe3ff');}
function drawEnd(win){glowTxt(win?'ПОБЕДА!':'ИГРА ОКОНЧЕНА',W/2,H*0.36,54,win?'#7cff4f':'#ff4f6a');
 glowTxt('ОЧКИ: '+score+'   РЕКОРД: '+rec,W/2,H*0.36+50,26,'#ffd23e');
 var opts=['ЗАНОВО','СМЕНИ ГЕРОЯ'];
 for(var i=0;i<2;i++){cx.save();cx.fillStyle=i===ovSel?'#ffd23e':'rgba(255,255,255,0.6)';cx.font='bold 24px Arial';cx.textAlign='center';if(i===ovSel){cx.shadowColor='#ffd23e';cx.shadowBlur=14;}cx.fillText(opts[i],W/2,H*0.62+i*44);cx.restore();}
 glowTxt('СТРЕЛКИ - ВЫБОР · ENTER - ОК',W/2,H*0.85,18,'#9ad0ff');}
function drawHUD(){for(var i=0;i<P.maxhp;i++){heartIc(22+i*22,26,1.6,i<P.hp);}
 cx.fillStyle='#fff';cx.font='bold 18px Arial';cx.textAlign='left';cx.fillText('УРОВЕНЬ '+(level+1),14,58);
 cx.textAlign='right';cx.fillText('ОЧКИ: '+score,W-12,30);
 cx.fillStyle='rgba(255,255,255,0.6)';cx.font='12px Arial';cx.fillText('РЕКОРД: '+rec,W-12,52);
 if(P.dbl>0){cx.fillStyle='#ff9a3c';cx.font='bold 12px Arial';cx.textAlign='left';cx.fillText('ОГОНЬ x2: '+P.dbl.toFixed(0)+'с',14,80);}
 if(P.shield>0){cx.fillStyle='#3cc4ff';cx.font='bold 12px Arial';cx.textAlign='left';cx.fillText('ЩИТ: '+P.shield.toFixed(0)+'с',14,98);}
 if(boss){cx.fillStyle='rgba(0,0,0,0.45)';cx.fillRect(W/2-180,14,360,14);cx.fillStyle='#ff4060';cx.fillRect(W/2-178,16,356*clamp(boss.hp/boss.maxhp,0,1),10);}}
function drawGame(){var hs=HEROS[selI];
 if(boss&&boss.type===2){
  if(boss.mt<1.2){cx.save();cx.strokeStyle='rgba(255,80,40,0.5)';cx.setLineDash([8,8]);cx.lineWidth=2;cx.beginPath();cx.moveTo(boss.aimx,boss.y+24);cx.lineTo(boss.aimx,H);cx.stroke();cx.restore();}
  else if(boss.mt<1.75){cx.save();cx.fillStyle='rgba(255,60,30,0.85)';cx.shadowColor='#ff4020';cx.shadowBlur=24;cx.fillRect(boss.aimx-14,boss.y+20,28,H-boss.y);cx.fillStyle='#fff';cx.fillRect(boss.aimx-5,boss.y+20,10,H-boss.y);cx.restore();}}
 for(var i=0;i<bonuses.length;i++)drawBonus(bonuses[i]);
 for(var i2=0;i2<enemies.length;i2++){var e=enemies[i2];
  if(e.type==='sekach')drawSekach(e.x,e.y,e.t,e);else if(e.type==='puh')drawPuh(e.x,e.y,e.t,e);
  else if(e.type==='zolt')drawZolt(e.x,e.y,e.t,e);else drawKorn(e.x,e.y,e.t,e);}
 for(var i3=0;i3<ebul.length;i3++)drawEB(ebul[i3]);
 if(boss)drawBoss(boss);
 for(var i4=0;i4<pbul.length;i4++)drawPB(pbul[i4]);
 if(!(P.inv>0&&Math.sin(tGlob*30)>0))drawHero(P.x,P.y,selI,tGlob);
 if(P.shield>0){cx.save();cx.globalAlpha=0.5+0.2*Math.sin(tGlob*6);neon(P.x,P.y,26,'#3cc4ff',3);cx.restore();}
 for(var i5=0;i5<parts.length;i5++){var p2=parts[i5];cx.globalAlpha=Math.max(0,p2.l*1.6);cx.fillStyle=p2.c;cx.fillRect(p2.x-2,p2.y-2,4,4);}cx.globalAlpha=1;
 drawHUD();
 if(bannerT>0){cx.save();cx.globalAlpha=Math.min(1,bannerT);glowTxt(banner,W/2,H*0.4,44,'#ffd23e');cx.restore();}}
function draw(){cx.save();if(shake>0){cx.translate(rnd(-1,1)*shake*8,rnd(-1,1)*shake*8);}drawBG();
 if(state==='title')drawTitle();else if(state==='select')drawSelect();
 else if(state==='over')drawEnd(false);else if(state==='win')drawEnd(true);else drawGame();
 if(state==='pause'){cx.fillStyle='rgba(5,3,15,0.6)';cx.fillRect(0,0,W,H);glowTxt('ПАУЗА',W/2,H/2,44,'#ffd23e');glowTxt('P - ПРОДОЛЖИТЬ',W/2,H/2+40,18,'#9ad0ff');}
 if(ERR){cx.fillStyle='rgba(150,10,10,0.92)';cx.fillRect(0,H-38,W,38);cx.fillStyle='#fff';cx.font='13px Arial';cx.textAlign='left';cx.fillText('Ошибка: '+ERR,10,H-14);}
 cx.restore();}
var last=0;
function loop(ts){requestAnimationFrame(loop);var dt=(ts-last)/1000;if(!dt||dt<0)dt=0.016;if(dt>0.05)dt=0.05;last=ts;tGlob+=dt;
 try{if(state==='play')upd(dt);}catch(e){ERR=String(e&&e.message||e);}
 draw();}
requestAnimationFrame(loop);

</script>
